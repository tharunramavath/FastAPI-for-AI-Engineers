<!DOCTYPE html>
<html lang="en">
<head>

<title>404 — FastAPI for AI Engineers</title>
<link rel="stylesheet" href="assets/style.css" />
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--cream-100)}

</head>
<body>
  <div class="four">
    <div class="code">404</div>

</html>
